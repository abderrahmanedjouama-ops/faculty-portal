[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["db/**", "public/*.html"]

# توجيه جميع طلبات الواجهة الخلفية (/api/*) إلى الدالة السحابية
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

# توجيه مسار الإدارة الرئيسي (/admin) ولوحات الأقسام المحمية (/admin/*) إلى الدالة السحابية
[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/api/admin"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/.netlify/functions/api/admin/:splat"
  status = 200
  force = true

# مسارات صفحات الواجهة الأمامية النظيفة
[[redirects]]
  from = "/student"
  to = "/student.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200
