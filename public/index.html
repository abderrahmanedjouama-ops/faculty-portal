<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>كلية العلوم والتكنولوجيا | وزارة التعليم العالي والبحث العلمي</title>
  <link rel="icon" type="image/jpeg" href="/images/fst-logo.jpg" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .gateway-wrapper {
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 2.5rem 2.5rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.25rem;
    }

    .gateway-mother-logo-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 0.9rem;
    }

    .gateway-mother-logo-frame {
      width: 138px;
      height: 138px;
      border-radius: 50%;
      background: var(--white);
      padding: 6px;
      box-shadow: 0 12px 30px rgba(10, 25, 47, 0.14);
      border: 2px solid var(--gray-200);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .gateway-mother-logo-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
      display: block;
    }

    .gateway-cards-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 2.5rem;
      align-items: stretch;
    }

    @media (max-width: 820px) {
      .gateway-cards-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .gateway-wrapper {
        padding: 1.5rem;
      }
    }

    .gateway-portal-card {
      background: var(--white);
      border: 1.5px solid var(--gray-200);
      border-radius: 22px;
      padding: 3.25rem 3rem;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 2rem;
      position: relative;
      overflow: hidden;
      transition: all 0.22s ease;
      cursor: pointer;
    }

    .gateway-portal-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 6px;
      background: var(--navy-800);
    }

    .gateway-portal-card.admin-portal-card::before {
      background: var(--navy-950);
    }

    .gateway-portal-card:hover {
      transform: translateY(-5px);
      border-color: var(--navy-700);
      box-shadow: var(--shadow-xl);
    }

    .gateway-card-icon-wrap {
      width: 82px;
      height: 82px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
    }

    .student-portal-card .gateway-card-icon-wrap {
      background: var(--navy-800);
      color: var(--gold-500);
    }

    .admin-portal-card .gateway-card-icon-wrap {
      background: var(--navy-950);
      color: var(--gold-500);
    }

    .gateway-card-title {
      font-size: 2.1rem;
      font-weight: 900;
      color: var(--navy-950);
      line-height: 1.25;
      margin: 0;
    }

    .gateway-card-cta {
      width: 100%;
      max-width: 340px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 1.05rem 1.75rem;
      border-radius: 12px;
      font-weight: 800;
      font-size: 1.08rem;
      transition: all 0.2s ease;
    }

    .student-portal-card .gateway-card-cta {
      background: var(--navy-800);
      color: var(--white);
    }

    .admin-portal-card .gateway-card-cta {
      background: var(--navy-950);
      color: var(--white);
    }

    .gateway-portal-card:hover .gateway-card-cta {
      background: var(--navy-700);
    }
  </style>
</head>
<body>

  <!-- الشريط الرسمي العلوي -->
  <div class="official-bar">
    <div class="official-bar-inner">
      <div>وزارة التعليم العالي والبحث العلمي</div>
    </div>
  </div>

  <!-- الترويسة الرسمية -->
  <header class="main-header">
    <div class="header-container">
      <a href="/" class="brand-group">
        <div class="university-crest">
          <img src="/images/fst-logo.jpg" alt="شعار كلية العلوم والتكنولوجيا" class="faculty-logo-img" />
        </div>
        <div class="brand-titles">
          <h1>كلية العلوم والتكنولوجيا</h1>
        </div>
      </a>
    </div>
  </header>

  <!-- المحتوى الرئيسي -->
  <main class="gateway-wrapper">

    <!-- الشعار الرسمي للكلية أعلى البطاقتين (Mother Logo) -->
    <div class="gateway-mother-logo-box">
      <div class="gateway-mother-logo-frame">
        <img src="/images/fst-logo.jpg" alt="شعار كلية العلوم والتكنولوجيا" />
      </div>
    </div>

    <div class="gateway-cards-grid">

      <!-- البطاقة الأولى: بوابة الطالب -->
      <a href="/student" id="studentPortalGatewayCard" class="gateway-portal-card student-portal-card">
        <div class="gateway-card-icon-wrap" aria-hidden="true">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
            <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
          </svg>
        </div>

        <h2 class="gateway-card-title">بوابة الطالب</h2>

        <div class="gateway-card-cta">
          <span>الدخول إلى بوابة الطالب</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </div>
      </a>

      <!-- البطاقة الثانية: بوابة الإدارة -->
      <a href="/login" id="adminPortalGatewayCard" class="gateway-portal-card admin-portal-card">
        <div class="gateway-card-icon-wrap" aria-hidden="true">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>

        <h2 class="gateway-card-title">بوابة الإدارة</h2>

        <div class="gateway-card-cta">
          <span>الدخول إلى بوابة الإدارة</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </div>
      </a>

    </div>
  </main>

  <!-- التذييل الرسمي -->
  <footer class="main-footer">
    <div class="footer-inner">
      <div>وزارة التعليم العالي والبحث العلمي — كلية العلوم والتكنولوجيا</div>
    </div>
  </footer>

</body>
</html>
