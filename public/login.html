<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بوابة الإدارة — تسجيل الدخول | كلية العلوم والتكنولوجيا</title>
  <link rel="icon" type="image/jpeg" href="/images/fst-logo.jpg" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .login-desktop-stage {
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-card {
      background: var(--white);
      border: 1.5px solid var(--gray-200);
      border-radius: 20px;
      box-shadow: var(--shadow-xl);
      overflow: hidden;
      padding: 2.5rem 2.75rem;
      position: relative;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 6px;
      background: var(--navy-950);
    }

    .login-card-header {
      text-align: center;
      margin-bottom: 1.85rem;
    }

    .login-card-logo {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--white);
      border: 2px solid var(--gray-200);
      padding: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      box-shadow: 0 8px 20px rgba(10, 25, 47, 0.12);
      overflow: hidden;
    }

    .login-card-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
      display: block;
    }

    .login-card-header h2 {
      font-size: 1.65rem;
      font-weight: 900;
      color: var(--navy-950);
      margin: 0;
    }
  </style>
</head>
<body>

  <!-- الشريط الرسمي العلوي -->
  <div class="official-bar">
    <div class="official-bar-inner">
      <div>وزارة التعليم العالي والبحث العلمي</div>
    </div>
  </div>

  <!-- الترويسة الرسمية -->
  <header class="main-header">
    <div class="header-container">
      <a href="/" class="brand-group">
        <div class="university-crest">
          <img src="/images/fst-logo.jpg" alt="شعار كلية العلوم والتكنولوجيا" class="faculty-logo-img" />
        </div>
        <div class="brand-titles">
          <h1>كلية العلوم والتكنولوجيا</h1>
        </div>
      </a>

      <div class="header-nav">
        <a href="/" class="nav-switch-btn" style="text-decoration: none;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          <span>العودة للصفحة الرئيسية</span>
        </a>
      </div>
    </div>
  </header>

  <!-- المحتوى الرئيسي -->
  <main class="login-desktop-stage">

    <div id="loginRedirectNotice" class="status-alert-box pending-alert" style="display: none; margin-top: 0; margin-bottom: 1.15rem;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="flex-shrink: 0; margin-top: 2px;">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <div id="loginRedirectNoticeText" style="font-size: 0.88rem; font-weight: 700;">
        يرجى تسجيل الدخول للوصول إلى لوحة التحكم.
      </div>
    </div>

    <div class="login-card">
      <div class="login-card-header">
        <div class="login-card-logo">
          <img src="/images/fst-logo.jpg" alt="شعار كلية العلوم والتكنولوجيا" />
        </div>
        <h2>تسجيل الدخول</h2>
      </div>

      <form id="departmentLoginForm" novalidate autocomplete="off">

        <!-- 1. اسم المستخدم -->
        <div class="form-group" style="margin-bottom: 1.35rem;">
          <label for="loginUsernameInput" class="form-label">
            <span>اسم المستخدم</span>
            <span class="required-star">*</span>
          </label>
          <input
            type="text"
            id="loginUsernameInput"
            name="username"
            class="form-control"
            placeholder="أدخل اسم المستخدم"
            dir="ltr"
            style="text-align: left; font-family: monospace; font-weight: 700; font-size: 1rem;"
            required
            autofocus
          />
        </div>

        <!-- 2. كلمة المرور -->
        <div class="form-group" style="margin-bottom: 1.6rem;">
          <label for="loginPasswordInput" class="form-label">
            <span>كلمة المرور</span>
            <span class="required-star">*</span>
          </label>
          <div style="position: relative; display: flex; align-items: center;">
            <input
              type="password"
              id="loginPasswordInput"
              name="password"
              class="form-control"
              placeholder="أدخل كلمة المرور"
              dir="ltr"
              style="text-align: left; font-family: monospace; padding-right: 3.4rem; font-weight: 700; font-size: 1rem;"
              required
            />
            <button
              type="button"
              id="toggleLoginPassBtn"
              style="position: absolute; right: 0.65rem; background: var(--gray-100); border: 1px solid var(--gray-300); border-radius: 6px; padding: 0.3rem 0.6rem; cursor: pointer; font-size: 0.78rem; font-family: inherit; font-weight: 700; color: var(--navy-800);"
            >
              إظهار
            </button>
          </div>
        </div>

        <!-- رسالة خطأ تسجيل الدخول -->
        <div id="loginErrorAlert" class="status-alert-box rejected-alert" style="display: none; margin-top: 0; margin-bottom: 1.2rem;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" style="flex-shrink: 0; margin-top: 2px;">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <div id="loginErrorText" style="font-size: 0.88rem; font-weight: 700;"></div>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.9rem 1.5rem; font-size: 1.02rem;">
          <span>تسجيل الدخول</span>
        </button>

      </form>
    </div>

  </main>

  <footer class="main-footer">
    <div class="footer-inner">
      <div>وزارة التعليم العالي والبحث العلمي — كلية العلوم والتكنولوجيا</div>
    </div>
  </footer>

  <script src="/js/data.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
